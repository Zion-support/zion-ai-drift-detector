<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Zion AI Drift Detector</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;cursor:pointer}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🛰️ Zion AI Drift Detector</h1><p>Detect configuration drift across your IT fleet against a golden baseline.</p><textarea id="cfg" rows="4" style="width:100%" placeholder="Paste current config values (one per line, key=value)"></textarea><br><br><button onclick="scan()">Scan for drift</button><div id="out"></div><script>const base={snmp:'v3',tls:'1.3',ntp:'pool.ntp.org',ssh_root:'no',password_policy:'14d'};function scan(){const lines=document.getElementById('cfg').value.split('\n').filter(x=>x.includes('='));let issues=[];lines.forEach(l=>{const[k,v]=l.split('=').map(s=>s.trim());if(base[k]&&base[k]!==v)issues.push(`⚠️ DRIFT: ${k} expected '${base[k]}' found '${v}' — severity ${k==='ssh_root'?'HIGH':'MEDIUM'}`)});document.getElementById('out').textContent=issues.length?issues.join('\n')+"\n\nRemediation playbook generated. Auto-fix available in enterprise tier — contact commercial@ziontechgroup.com":'✅ No drift detected vs baseline.'}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/zion-ai-drift-detector">GitHub</a> · <a href="https://ziontechgroup.com/zion-ai-compliance-scanner/">Compliance Scanner</a></p></body></html>
